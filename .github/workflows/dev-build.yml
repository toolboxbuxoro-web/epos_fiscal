name: Dev Build (Windows-only)

# Быстрая Windows-сборка для dev-тестирования. Триггер ручной через CLI:
#   gh workflow run dev-build.yml
#
# По сравнению с release.yml:
#   - только Windows (без macOS) → ~4 мин вместо 10
#   - без подписи (TAURI_SIGNING_*) — не нужна для теста
#   - НЕ создаёт GitHub Release — exe кладётся как Artifact (90 дней)
#   - можно скачать через `gh run download <run-id>`
#
# Цель — быстрая итерация: правка → тест на Win-машине без публикации.

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev-test/**'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build (without bundle signing)
        run: npm run tauri -- build
        # Без TAURI_SIGNING_* env vars — bundler пропустит подпись.
        # Auto-updater не сработает (нет signature.sig), но для ручной
        # установки .exe это не нужно.

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-fiscal-dev-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Echo download instructions
        shell: bash
        run: |
          echo "::notice::Готово. Скачать локально:"
          echo "::notice::  gh run download ${{ github.run_id }} --name toolbox-fiscal-dev-${{ github.sha }}"
