name: Dev Build (Windows-only)

# Быстрая Windows-сборка для dev-тестирования. Триггер ручной через CLI:
#   gh workflow run dev-build.yml
#
# По сравнению с release.yml:
#   - только Windows (без macOS) → ~4 мин вместо 10
#   - без подписи (TAURI_SIGNING_*) — не нужна для теста
#   - НЕ создаёт GitHub Release — exe кладётся как Artifact (90 дней)
#   - можно скачать через `gh run download <run-id>`
#
# Цель — быстрая итерация: правка → тест на Win-машине без публикации.

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev-test/**'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build & sign
        run: npm run tauri -- build
        env:
          # tauri.conf.json содержит updater.pubkey → bundler требует
          # соответствующий private key, иначе exit 1 в конце сборки
          # (см. https://v2.tauri.app/plugin/updater/). Используем те же
          # секреты что и в release.yml — безопасно, хранятся в GitHub Secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-fiscal-dev-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Echo download instructions
        shell: bash
        run: |
          echo "::notice::Готово. Скачать локально:"
          echo "::notice::  gh run download ${{ github.run_id }} --name toolbox-fiscal-dev-${{ github.sha }}"
